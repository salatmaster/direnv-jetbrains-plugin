name: Release

# Releasing is a dispatch, not a tag push. The workflow writes the changelog entry for
# the version, builds and verifies, and only then commits and tags — so the tag always
# points at a commit containing its own changelog, and a failed build leaves main
# untouched. Pushing a tag by hand does nothing.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading v (for example 0.1.0)'
        required: true
        type: string

permissions:
  contents: write

# Two releases must never interleave: both push main.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      # First, because it is the only step that validates the version, and it refuses to
      # release one whose [Unreleased] section says nothing.
      - name: Cut the changelog
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: .github/scripts/cut-changelog.sh "${{ inputs.version }}" "$(date -u +%Y-%m-%d)"

      - name: Check the version is free
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "Tag v$VERSION already exists. Delete it, or pick another version." >&2
            exit 1
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists." >&2
            exit 1
          fi

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Test
        env:
          PLUGIN_VERSION: ${{ inputs.version }}
        run: ./gradlew test --no-daemon

      # Runs here rather than on every push because it downloads whole IDEs, and here is
      # where it pays: nothing is committed, tagged or published after it. Publishing an
      # incompatible plugin is far harder to walk back than failing a workflow run.
      - name: Verify against the target IDEs
        env:
          PLUGIN_VERSION: ${{ inputs.version }}
        run: ./gradlew verifyPlugin --no-daemon

      - name: Upload the verification report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-verifier-report
          path: build/reports/pluginVerifier

      # signPlugin depends on buildPlugin, so this both builds and signs. Signing has to happen
      # before the GitHub release is created, or the archive attached to the release would be the
      # unsigned one while only the Marketplace received a signed build — installing from GitHub
      # would then warn about an unknown author for no reason.
      - name: Build and sign the plugin
        env:
          PLUGIN_VERSION: ${{ inputs.version }}
          CERTIFICATE_CHAIN: ${{ secrets.PLUGIN_CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PLUGIN_PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PLUGIN_PRIVATE_KEY_PASSWORD }}
        run: ./gradlew signPlugin --no-daemon

      # Nothing has been pushed until here, so a red build costs a workflow run and
      # nothing else. The push of main fails rather than rebasing if someone landed a
      # commit meanwhile: the artifact above was built from this tree, not that one.
      - name: Commit the changelog and tag it
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "CHANGELOG.md was already current for $VERSION."
          else
            git commit -m "Cut $VERSION in the changelog"
            git push origin main
          fi
          git tag -a "v$VERSION" -m "$VERSION"
          git push origin "v$VERSION"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          # Notes come from the changelog rather than from --generate-notes. A list of merged pull
          # request titles records what landed, not what changed for someone installing the plugin,
          # and it appends a "New Contributors" block that says nothing on a single-author
          # repository. The script fails when the section is missing, so a release cannot quietly
          # ship notes that say nothing.
          .github/scripts/release-notes.sh "$VERSION" > "$RUNNER_TEMP/release-notes.md"

          # Named explicitly: signPlugin leaves the unsigned archive next to the signed one, and a
          # bare *.zip would attach both, letting people download the unsigned build by accident.
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            build/distributions/*-signed.zip

      # A separate, deliberate step: a bad release on the Marketplace cannot be withdrawn
      # as easily as a tag, so releasing alone never publishes there. Set the repository
      # variable PUBLISH_TO_MARKETPLACE to true once the listing is ready.
      - name: Publish to the JetBrains Marketplace
        if: ${{ vars.PUBLISH_TO_MARKETPLACE == 'true' }}
        env:
          PLUGIN_VERSION: ${{ inputs.version }}
          PUBLISH_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.PLUGIN_CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PLUGIN_PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PLUGIN_PRIVATE_KEY_PASSWORD }}
        run: ./gradlew publishPlugin --no-daemon
