pluginGroup = io.github.salatmaster.direnv
pluginName = direnv
pluginRepositoryUrl = https://github.com/salatmaster/direnv-jetbrains-plugin
pluginVersion = 0.1.0

pluginSinceBuild = 261
platformVersion = 2026.1

# The IntelliJ Platform ships kotlin-stdlib. Bundling a second copy causes LinkageError
# when the plugin shares a classloader with other plugins.
kotlin.stdlib.default.dependency = false

org.gradle.caching = true
org.gradle.parallel = true
org.gradle.jvmargs = -Xmx2048m -XX:MaxMetaspaceSize=512m
